name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check the app imports
        working-directory: backend
        # Catches syntax errors, bad imports, and Pydantic model errors before
        # they reach Railway. Runs without API keys, so it must not call out.
        env:
          ELEVENLABS_API_KEY: ci-placeholder
          GROQ_API_KEY: ci-placeholder
        run: python -c "from app.main import app; print(f'{len(app.routes)} routes registered')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build
